name: Refresh data

# Daily at 06:00 UTC (PRD 9.2). The pipeline decides which tiers are due: daily every day, weekly on
# Mondays, monthly on the 1st. It commits the new data to this repo, then rebuilds and deploys the site.
# Run it by hand from the Actions tab ("Run workflow"), optionally for specific series.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Which series to refresh
        type: choice
        options: [all, scheduled, daily, weekly, monthly]
        default: all
      only:
        description: "Optional: comma-separated series IDs, e.g. US.I1,EA.R2 (overrides tier)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      refresh_outcome: ${{ steps.refresh.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Fetch, store and derive
        id: refresh
        # A run where every series fails still commits its status, so the Data Status page shows the errors.
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIER: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.tier }}
          ONLY: ${{ inputs.only }}
        run: node pipeline/run.ts --tier "$TIER" --only "$ONLY"

      - name: Guard against a leaked API key in data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ] && grep -rqF "$FRED_API_KEY" data; then
            echo "The FRED API key appeared in data/. Refusing to commit." >&2; exit 1; fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d) (${{ github.event_name }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Mark the run failed (so GitHub notifies) only when no series refreshed at all.
  report:
    needs: [refresh, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check refresh result
        run: |
          if [ "${{ needs.refresh.outputs.refresh_outcome }}" = "failure" ]; then
            echo "Every series failed to refresh. See the Data Status page or the run log." >&2; exit 1; fi
          echo "Refresh ok (partial failures, if any, are on the Data Status page)."
