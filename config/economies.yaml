# The 15 economies covered by the dashboard (PRD section 4.1). List order is the default display order.
#
# gdp_weight      Approximate share of world GDP (nominal USD, IMF WEO 2025 estimates). Used to rank
#                 change events (PRD 5.5). Approximate; refresh from IMF WEO data in Phase 1.
# inflation_target  Central bank (or government) inflation target in %, drawn as the CPI reference line.
#                 Target ranges are stored as their midpoint; the range is in inflation_target_note.
#                 To be re-confirmed against each central bank's site in Phase 1.
# group / member_of  The Euro Area appears as an aggregate and through Germany and France; the UI groups
#                 them so the overlap is clear.

economies:
  - id: US
    name: United States
    region: Americas
    gdp_weight: 0.268
    inflation_target: 2.0
    inflation_target_note: Federal Reserve, 2% PCE inflation (CPI shown against it as a guide)
    why: Largest economy; sets global rates and the dollar
    data_gaps: null

  - id: EA
    name: Euro Area
    region: Europe
    group: Euro Area
    gdp_weight: 0.144
    inflation_target: 2.0
    inflation_target_note: ECB, symmetric 2% HICP inflation over the medium term
    why: Second-largest bloc; ECB policy
    data_gaps: National items (e.g. house prices) use aggregates
    notes: Aggregate with changing composition (21 members from 2026, when Bulgaria joined).

  - id: DE
    name: Germany
    region: Europe
    group: Euro Area
    member_of: EA
    gdp_weight: 0.042
    inflation_target: 2.0
    inflation_target_note: ECB target applies (euro area member)
    why: Europe's industrial core; global manufacturing signal
    data_gaps: null

  - id: FR
    name: France
    region: Europe
    group: Euro Area
    member_of: EA
    gdp_weight: 0.028
    inflation_target: 2.0
    inflation_target_note: ECB target applies (euro area member)
    why: Large economy; fiscal-stress watch
    data_gaps: null

  - id: UK
    name: United Kingdom
    region: Europe
    gdp_weight: 0.034
    inflation_target: 2.0
    inflation_target_note: Bank of England, 2% CPI
    why: Major financial centre; separate policy
    data_gaps: null

  - id: JP
    name: Japan
    region: Asia
    gdp_weight: 0.037
    inflation_target: 2.0
    inflation_target_note: Bank of Japan, 2% CPI
    why: Third-largest economy; unique rates and currency regime
    data_gaps: null

  - id: CN
    name: China
    region: Asia
    gdp_weight: 0.169
    inflation_target: 2.0
    inflation_target_note: Government CPI target of around 2% (set annually)
    why: Second-largest economy; drives commodities and trade
    data_gaps: Official data less timely and less reliable; some series missing from OECD

  - id: IN
    name: India
    region: Asia
    gdp_weight: 0.037
    inflation_target: 4.0
    inflation_target_note: Reserve Bank of India, 4% CPI with a 2-6% band
    why: Fastest-growing large economy
    data_gaps: Unemployment and wage data limited

  - id: KR
    name: South Korea
    region: Asia
    gdp_weight: 0.016
    inflation_target: 2.0
    inflation_target_note: Bank of Korea, 2% CPI
    why: Exports are an early read on the global goods cycle
    data_gaps: null

  - id: TW
    name: Taiwan
    region: Asia
    gdp_weight: 0.007
    inflation_target: null
    inflation_target_note: No formal inflation target
    why: Semiconductor hub; exports lead the tech cycle
    data_gaps: Not covered by IMF or OECD; needs national sources

  - id: ID
    name: Indonesia
    region: Asia
    gdp_weight: 0.013
    inflation_target: 2.5
    inflation_target_note: Bank Indonesia, 2.5% plus or minus 1 point
    why: Large emerging market; commodities
    data_gaps: Several monthly series missing

  - id: AU
    name: Australia
    region: Oceania
    gdp_weight: 0.016
    inflation_target: 2.5
    inflation_target_note: Reserve Bank of Australia, 2-3% range (midpoint shown)
    why: Commodity exporter; China-linked
    data_gaps: Some data quarterly rather than monthly

  - id: CA
    name: Canada
    region: Americas
    gdp_weight: 0.020
    inflation_target: 2.0
    inflation_target_note: Bank of Canada, 2% midpoint of a 1-3% range
    why: Commodity exporter; US-linked
    data_gaps: null

  - id: BR
    name: Brazil
    region: Americas
    gdp_weight: 0.019
    inflation_target: 3.0
    inflation_target_note: Banco Central do Brasil, continuous 3% target with a 1.5-point band
    why: Largest Latin American economy
    data_gaps: Wage data limited

  - id: MX
    name: Mexico
    region: Americas
    gdp_weight: 0.016
    inflation_target: 3.0
    inflation_target_note: Banco de Mexico, 3% plus or minus 1 point
    why: US manufacturing partner
    data_gaps: null
